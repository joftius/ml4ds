project:
  type: website
  output-dir: docs
  # Render list. From 28 September 2026 the rule is: whatever week folders are
  # in this build tree are live. A week is imported into the tree (with
  # _build_env/build.sh import) only when it is released, so the per-week
  # entries of the staged-release list are replaced by globs. The instructor
  # project, the complete notebooks, the templates and the build helpers stay
  # out of the public tree regardless.
  render:
    - "index.qmd"
    - "about.qmd"
    - "weeks/**/*.qmd"
    - "data/*.md"
    - "!weeks/**/*_complete.qmd"
    - "!instructor/**"
    - "!_templates/**"
    - "!_build_env/**"
    - "!**/*.Rmd"
    - "!README*.md"
  # Student-downloadable sources: the student notebooks (notebookN.qmd, generated
  # from instructor/.../notebookN_complete.qmd by _build_env/make_incomplete.py)
  # are copied next to their rendered HTML so that ".html -> .qmd" in the
  # address bar still works. Complete notebooks are not under weeks/, and are
  # excluded again here in case one is ever put there by mistake.
  resources:
    - "files/**"
    - "weeks/*/notebooks/*.qmd"
    - "!instructor/**"
    - "!_templates/**"
    - "!_build_env/**"
    - "!**/*_complete.qmd"
    - "!**/*.Rmd"
  preview:
    port: 4321
    browser: false

website:
  title: "machine learning 4 data science"
  description: "ST310 at LSE: a core set of machine learning methods, practiced in R, and what a prediction competition does and does not establish."
  site-url: https://ml4ds.com
  search: false
  navbar:
    lowercase: true
    logo: files/sticker.png
    logo-alt: "ml4ds"
    logo-href: https://ml4ds.com
    right:
      - text: "references"
        menu:
          - text: "ISLR"
            href: https://www.statlearning.com/
          - text: "PPA (Patterns, Predictions, and Actions)"
            href: https://mlstory.org/
          - text: "CausalML"
            href: https://causalml-book.org/
          - text: "R4DS"
            href: https://r4ds.hadley.nz/
          - text: "ESL"
            href: https://hastie.su.domains/ElemStatLearn/
          - text: "CASI"
            href: https://hastie.su.domains/CASI/
          - text: "IML"
            href: https://christophm.github.io/interpretable-ml-book/
      - text: "content"
        href: index.qmd
      - text: "about"
        href: about.qmd
  page-footer:
    left: "ST310 Machine Learning, LSE. Original course content CC BY 4.0 except where otherwise credited; datasets and images carry their own licences."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-width: 7
    fig-height: 4.5
    fig-dpi: 150
    cookie-consent:
      type: express
      style: simple
      palette: light

execute:
  freeze: auto
  warning: false
  message: false

editor: source
